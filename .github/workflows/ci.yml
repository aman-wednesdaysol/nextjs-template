name: Next.js Template CI
on:
  pull_request:
    branches:
      - "**"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn --frozen-lockfile --network-timeout 300000        

      - name: Lint
        run: yarn lint

      - name: Test and generate coverage report
        uses: artiomtr/jest-coverage-report-action@v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          threshold: 80
          package-manager: yarn

      - name: Build
        run: yarn build:dev
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      - name: Debug dependencies
        run: |
          echo "=== package.json dependencies ==="
          cat package.json | grep posthog
          echo "=== checking node_modules ==="
          ls node_modules | grep posthog || echo "posthog NOT found in node_modules"
          echo "=== yarn.lock check ==="
          grep posthog yarn.lock || echo "posthog NOT found in yarn.lock"
